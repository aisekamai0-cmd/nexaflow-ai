<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaFlow AI - Lead Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:30px;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#8b5cf6;
}

.subtitle{
  color:#9ca3af;
  margin-top:5px;
}

button{
  background:#8b5cf6;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.card{
  background:#111827;
  border:1px solid #273244;
  border-radius:16px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:15px;
  text-align:left;
  border-bottom:1px solid #273244;
}

th{
  color:#a78bfa;
  font-size:13px;
}

td{
  color:#e5e7eb;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#064e3b;
  color:#6ee7b7;
  font-size:12px;
}

.message{
  padding:30px;
  text-align:center;
  color:#9ca3af;
}

@media(max-width:700px){
  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .card{
    overflow-x:auto;
  }

  table{
    min-width:700px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <div class="logo">NexaFlow <span>AI</span></div>
      <div class="subtitle">Lead Dashboard</div>
    </div>

    <button onclick="loadLeads()">Refresh Leads</button>
  </div>

  <div class="card">
    <div id="message" class="message">
      Loading leads...
    </div>

    <table id="leadTable" style="display:none;">
      <thead>
        <tr>
          <th>Name</th>
          <th>WhatsApp / Phone</th>
          <th>Preferred Time</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="leadBody"></tbody>
    </table>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://yejjedfoaueslbccqvdp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kgBAGamF48DsEqcbGS9rmA_Z9MM3WiJ";

async function loadLeads(){

  const message = document.getElementById("message");
  const table = document.getElementById("leadTable");
  const body = document.getElementById("leadBody");

  message.style.display = "block";
  message.innerText = "Loading leads...";
  table.style.display = "none";
  body.innerHTML = "";

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/leads?select=id,name,phone,preferred_time,created_at&order=created_at.desc",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        }
      }
    );

    const data = await response.json();

    console.log("Supabase response:", data);

    if(!response.ok){
      throw new Error(
        data.message ||
        data.error_description ||
        JSON.stringify(data)
      );
    }

    if(!Array.isArray(data) || data.length === 0){
      message.innerText = "No leads yet";
      return;
    }

    data.forEach(lead => {

      const row = document.createElement("tr");

      const date = lead.created_at
        ? new Date(lead.created_at).toLocaleString()
        : "-";

      row.innerHTML = `
        <td>${escapeHTML(lead.name)}</td>
        <td>${escapeHTML(lead.phone)}</td>
        <td>${escapeHTML(lead.preferred_time)}</td>
        <td>${escapeHTML(date)}</td>
        <td><span class="status">New</span></td>
      `;

      body.appendChild(row);
    });

    message.style.display = "none";
    table.style.display = "table";

  }catch(error){

    console.error("Lead loading error:", error);

    message.innerText =
      "Could not load leads: " + error.message;
  }
}

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

loadLeads();

</script>

</body>
</html>
