<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexaFlow AI — Lead Dashboard</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#06101d;
    color:#fff;
}

header{
    padding:20px;
    background:#0b1728;
    border-bottom:1px solid #1e334d;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#67e8f9;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 18px;
}

h1{
    margin-bottom:8px;
}

.subtitle{
    color:#94a3b8;
    margin-bottom:25px;
}

.card{
    background:#0d1b2e;
    border:1px solid #1e334d;
    border-radius:14px;
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:15px;
    text-align:left;
    border-bottom:1px solid #1e334d;
}

th{
    color:#67e8f9;
    font-size:13px;
}

td{
    color:#dbeafe;
}

.status{
    color:#22c55e;
    font-weight:700;
}

.empty{
    padding:40px;
    text-align:center;
    color:#94a3b8;
}

.loading{
    padding:40px;
    text-align:center;
    color:#67e8f9;
}

.error{
    padding:25px;
    text-align:center;
    color:#f87171;
}

.refresh{
    margin-bottom:18px;
    padding:10px 16px;
    border:0;
    border-radius:9px;
    background:#67e8f9;
    color:#041018;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:700px){
    .card{
        overflow-x:auto;
    }

    table{
        min-width:750px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Nexa<span>Flow</span> AI</div>
</header>

<div class="container">

<h1>Lead Dashboard</h1>

<div class="subtitle">
    Customer leads captured by your AI agent.
</div>

<button class="refresh" onclick="loadLeads()">
    Refresh Leads
</button>

<div class="card">

<table>

<thead>
<tr>
    <th>Name</th>
    <th>WhatsApp / Phone</th>
    <th>Preferred Time</th>
    <th>Date</th>
    <th>Status</th>
</tr>
</thead>

<tbody id="leadsTable">

<tr>
    <td colspan="5" class="loading">
        Loading leads...
    </td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

const SUPABASE_URL =
"https://yejjedfoaueslbccqvdp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kgBAGamF48DsEqcbGS9rmA_Z9MM3WiJ";


async function loadLeads(){

    const table =
        document.getElementById("leadsTable");

    table.innerHTML =
        '<tr><td colspan="5" class="loading">Loading leads...</td></tr>';


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/leads?select=*&order=created_at.desc",
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            const error =
                await response.text();

            throw new Error(error);
        }


        const leads =
            await response.json();


        if(leads.length === 0){

            table.innerHTML =
                '<tr><td colspan="5" class="empty">No leads yet.</td></tr>';

            return;
        }


        table.innerHTML = "";


        leads.forEach(function(lead){

            const row =
                document.createElement("tr");


            const date =
                lead.created_at
                ? new Date(lead.created_at).toLocaleString()
                : "-";


            row.innerHTML =

                "<td>" +
                escapeHTML(lead.name) +
                "</td>" +

                "<td>" +
                escapeHTML(lead.phone) +
                "</td>" +

                "<td>" +
                escapeHTML(lead.preferred_time) +
                "</td>" +

                "<td>" +
                escapeHTML(date) +
                "</td>" +

                "<td class='status'>New</td>";


            table.appendChild(row);

        });

    }

    catch(error){

        console.error(error);

        table.innerHTML =
            '<tr><td colspan="5" class="error">' +
            'Could not load leads.' +
            '</td></tr>';

    }
}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


loadLeads();

</script>

</body>
</html>
